<!doctype html>
<html lang="en-SG">
<head>
<meta charset="utf-8">
<!-- One-off 1200x630 Open Graph card, rendered headless to web/public/og.png (see the polish plan).
     Static and neutral on purpose: it never implies a particular reading. -->
<style>
  @font-face {
    font-family: 'Bricolage Grotesque';
    src: url('../node_modules/@fontsource-variable/bricolage-grotesque/files/bricolage-grotesque-latin-wght-normal.woff2') format('woff2-variations');
    font-weight: 200 800;
    font-display: block;
  }
  * { margin: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    font-family: 'Bricolage Grotesque', system-ui, sans-serif;
    color: #1F3346;
    background: linear-gradient(158deg, #BFD9EE 0%, #AFB9BF 52%, #D6DFD8 100%);
    display: flex; flex-direction: column; justify-content: space-between;
    padding: 76px 84px;
  }
  .word { font-size: 138px; font-weight: 700; letter-spacing: -0.025em; line-height: 0.95; }
  .word .dot { color: #2E5B7A; }
  .tag { font-size: 42px; font-weight: 400; line-height: 1.22; max-width: 860px; color: #24333F; }
  .foot { font-size: 30px; font-weight: 500; letter-spacing: 0.01em; color: #33505F; }
</style>
</head>
<body>
  <div class="word">HazeWatch<span class="dot">.</span></div>
  <div class="tag">Singapore air quality, in plain language.</div>
  <div class="foot">PSI &middot; AQI &middot; the five NEA regions</div>
</body>
</html>
